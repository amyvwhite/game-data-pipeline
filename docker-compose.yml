# `docker compose up` starts Postgres, runs the pipeline once for today, and
# serves the dashboard at http://localhost:8000
#
# Settings come from .env if you have one (copy .env.example). Without it,
# the defaults below are enough for a local run.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-games}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-games}
      POSTGRES_DB: ${POSTGRES_DB:-games}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-games} -d ${POSTGRES_DB:-games}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is "db", not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-games}:${POSTGRES_PASSWORD:-games}@db:5432/${POSTGRES_DB:-games}
    volumes:
      - ./data:/app/data
      - ./dashboard/data:/app/dashboard/data
    command: ["python", "-m", "pipeline.run"]

  dashboard:
    image: python:3.12-slim-bookworm
    working_dir: /site
    volumes:
      - ./dashboard:/site:ro
    ports:
      - "8000:8000"
    command: ["python", "-m", "http.server", "8000"]

volumes:
  pgdata:
