name: CI

on:
  push:
    paths-ignore:          # the hourly data commits don't need the full test suite
      - "data/warehouse/**"
      - "dashboard/data/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff~=0.17.0
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: games_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d games_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/games_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # Spark needs a JVM
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --cov --cov-report=term   # fails if coverage drops below 85% (pyproject.toml)
      - name: AWS template matches the Spark schemas (no drift)
        run: python infra/aws/build_template.py --check
      - name: Lint the CloudFormation template
        run: cfn-lint infra/aws/stack.yml

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t game-data-pipeline:${{ github.sha }} .
