# Runs the pipeline every hour on GitHub's servers, keeps the history in the repo,
# and publishes the dashboard to GitHub Pages. No server or cloud account needed.
#
# Each run:
#   1. starts a fresh Postgres and restores the history from data/warehouse/*.csv
#   2. runs the pipeline in "auto" mode (players, the Steam top-100 market and Twitch
#      every hour; prices, review totals and review themes once a day), including
#      quality checks, anomaly detection and 24-hour-ahead forecasts
#   3. dumps the tables back to CSV and commits them (with the dashboard data)
#   4. deploys dashboard/ to GitHub Pages
#
# One-time setup (see docs/GO_LIVE.md): Settings -> Pages -> Source: "GitHub Actions",
# and Settings -> Actions -> General -> Workflow permissions: "Read and write".
# Optional secrets: TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET, SLACK_WEBHOOK_URL.

name: Live pipeline

on:
  schedule:
    # GitHub's scheduler is best-effort and drops runs when busy (on this repo only 2 of ~10
    # hourly runs fired the first night). Asking three times an hour, away from the busy
    # top of the hour, means at least one lands each hour; extra runs only add finer data.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:         # "Run workflow" button for a manual run

permissions:
  contents: write   # commit the updated data
  pages: write      # deploy the dashboard
  id-token: write   # Pages deploy, and AWS sign-in through OIDC (no stored AWS keys)

concurrency:
  group: live-pipeline   # never two runs writing the data at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: games
          POSTGRES_PASSWORD: games
          POSTGRES_DB: games
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U games -d games"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://games:games@localhost:5432/games
      STORAGE_BACKEND: local
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # AWS data lake (optional): set these repository variables from the CloudFormation
      # stack outputs (docs/AWS_SETUP.md). Not secrets: an ARN and a bucket name are not credentials.
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    outputs:
      pipeline_exit: ${{ steps.run.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # Spark needs a JVM
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Restore history from data/warehouse
        run: python -m pipeline.warehouse restore

      - name: Run the pipeline
        id: run
        run: |
          set +e
          python -m pipeline.run --sources auto --no-parquet
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0   # always save what we have; the result is checked in the last step

      - name: Save history back to data/warehouse
        run: python -m pipeline.warehouse dump

      - name: Commit the new data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warehouse dashboard/data/summary.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: hourly snapshot $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      # ---- AWS data lake: once a day, yesterday's complete data as Parquet (ADR 0005) ----
      # Runs after the data is committed, so an AWS problem can never cost collected data.
      - name: Sign in to AWS (OIDC, short-lived credentials)
        id: aws
        if: vars.AWS_ROLE_ARN != '' && steps.run.outputs.exit_code == '0'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          role-session-name: game-data-pipeline-${{ github.run_id }}

      - name: Export missing days to the data lake and check them with Athena
        id: lake
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: python -m pipeline.lake export   # usually "nothing to export"; ~7 small files once a day

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Fail the run if the data-lake export failed
        if: steps.aws.outcome == 'failure' || steps.lake.outcome == 'failure'
        run: |
          echo "::error::AWS data-lake step failed (the data was still collected and committed). See the 'Sign in to AWS' and 'Export' steps."
          exit 1

      - name: Fail the run if the pipeline failed
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "::error::Pipeline exited with code ${{ steps.run.outputs.exit_code }} (1 = data-quality check failed, 2 = crash). See the 'Run the pipeline' step."
          exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
