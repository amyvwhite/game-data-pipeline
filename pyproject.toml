[project]
name = "game-data-pipeline"
version = "0.2.0"
description = "Hourly pipeline for public Steam and Twitch game data: extract, PySpark transform, quality checks, Postgres load, forecasts and a live dashboard."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP017"]  # timezone.utc reads fine and works on older Pythons

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a real PostgreSQL (set TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true   # pyspark / boto3 ship partial or no stubs
warn_unused_ignores = true
files = ["pipeline"]

[tool.coverage.run]
source = ["pipeline"]
branch = false

[tool.coverage.report]
fail_under = 85
show_missing = false
