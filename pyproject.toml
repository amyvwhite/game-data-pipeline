[project]
name = "game-data-pipeline"
version = "0.1.0"
description = "Daily pipeline for public Steam game data: extract, PySpark transform, quality checks, Postgres load."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP017"]  # timezone.utc reads fine and works on older Pythons

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a real PostgreSQL (set TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]
